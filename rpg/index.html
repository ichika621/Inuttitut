<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Words of the Snow Village — Labrador Inuttitut RPG</title>
  <meta name="description" content="A life-sim RPG for learning Labrador Inuttitut (Nunatsiavummiutut) from A1 to A2 — in English and Japanese." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <div id="game">
    <div id="stage">
      <canvas id="world" aria-label="Village map"></canvas>

      <div id="hud">
        <div id="hud-quest" class="px-panel"></div>
        <div id="hud-right">
          <canvas id="minimap" class="px-panel" aria-label="Minimap"></canvas>
          <div id="hud-skills" class="px-panel"></div>
          <div class="hud-btns"><button id="hud-book" class="px-btn sm"></button><button id="hud-menu" class="px-btn sm"></button></div>
        </div>
      </div>

      <div id="dlg" class="px-panel" hidden>
        <div id="dlg-portrait" hidden></div>
        <div id="dlg-main">
          <div id="dlg-name"></div>
          <div id="dlg-pic"></div>
          <div id="dlg-body"></div>
          <div id="dlg-choices"></div>
        </div>
        <button id="dlg-next" class="px-btn sm" hidden aria-label="Next">▼</button>
      </div>

      <div id="panel" class="panel" hidden></div>
      <div id="title" hidden></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <div id="pad" aria-hidden="true">
      <div class="dpad">
        <button data-pad="1" class="up">▲</button>
        <button data-pad="2" class="left">◀</button>
        <button data-pad="3" class="right">▶</button>
        <button data-pad="0" class="down">▼</button>
      </div>
      <button id="pad-a">A</button>
    </div>
  </div>

  <script src="i18n.js?v=6"></script>
  <script src="lexicon.js?v=6"></script>
  <script src="story.js?v=6"></script>
  <script src="art.js?v=6"></script>
  <script src="content.js?v=6"></script>
  <script src="game.js?v=6"></script>
  <script src="ui.js?v=6"></script>
  <script>
    UI.bind();
    G.audioInit(function () { G.boot(); UI.title(); });
  </script>
</body>
</html>
